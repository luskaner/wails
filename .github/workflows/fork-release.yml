name: fork-release

# Republishes this fork whenever wailsapp/wails cuts a new v3 release: the
# patch in fork/patches is applied on top of the upstream tag, and the result
# is tagged and released as <upstream tag>-patched.
#
# The commit and the tag are signed with GPG, the same way the ageLANServer
# releases are, so whoever downloads the module can verify where it comes
# from. The signing key is read from the GPG_PRIVATE_KEY and PASSPHRASE
# secrets; without them the release is published unsigned.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream v3 tag to patch (defaults to the latest one)'
        required: false
        type: string
      publish:
        description: 'Push the tag and publish the release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  workflows: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: v3/go.sum
      - name: Import GPG key
        id: import_gpg
        if: env.GPG_PRIVATE_KEY != ''
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/wailsapp/wails.git 2>/dev/null ||
            git remote set-url upstream https://github.com/wailsapp/wails.git
      - name: Patch and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          PUBLISH: ${{ inputs.publish }}
          GIT_SIGNING_KEY: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          args=()
          if [ -n "$UPSTREAM_TAG" ]; then
            args+=(--tag "$UPSTREAM_TAG")
          fi
          if [ "$PUBLISH" = "false" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$GIT_SIGNING_KEY" ]; then
            args+=(--require-signature)
          fi
          bash fork/release.sh "${args[@]}"
